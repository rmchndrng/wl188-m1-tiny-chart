apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-idle
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: idle
          image: busybox:1.36.1
          command: ["sh", "-c", "sleep 3600"]
          readinessProbe:
            exec: {command: ["true"]}
